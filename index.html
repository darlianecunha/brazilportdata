        function fmt(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(0) + 'K';
            return num.toString();
        }

        function fmtTonnes(num) { return (num / 1e6).toFixed(2) + ' M tonnes'; }
        function pctChange(a, b) { return (((b - a) / a) * 100).toFixed(1); }

        // ========== ANIMATED COUNTER ==========
        function AnimatedCounter({ target, suffix }) {
            const [val, setVal] = useState(0);
            const ref = useRef(null);
            const ran = useRef(false);
            useEffect(() => {
                const obs = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting && !ran.current) {
                        ran.current = true;
                        const dur = 1800, t0 = performance.now();
                        function tick(now) {
                            const p = Math.min((now - t0) / dur, 1);
                            setVal(Math.round((1 - Math.pow(1 - p, 3)) * target));
                            if (p < 1) requestAnimationFrame(tick);
                        }
                        requestAnimationFrame(tick);
                    }
                }, { threshold: 0.2 });
                if (ref.current) obs.observe(ref.current);
                return () => obs.disconnect();
            }, [target]);
            return <span ref={ref} className="stat-counter">{fmtFull(val)}{suffix && <span style={{fontSize:'0.6em',opacity:0.7,marginLeft:4}}>{suffix}</span>}</span>;

                            </div>
                            <div className="kpi-card">
                                <p className="kpi-label">Public Ports</p>
                                <p className="kpi-value">{publicCount}</p>
                                <p style={{fontSize:'0.7rem',color:'#9ca3af'}}>Porto Organizado</p>
                            </div>
                            <div className="kpi-card">
                                <p className="kpi-label">#1 Facility</p>
                                <p style={{fontSize:'1rem',fontWeight:700,color:'#111827'}}>{PORTS[0].name}</p>
                                <p style={{fontSize:'0.7rem',color:'#9ca3af'}}>{PORTS[0].state}</p>
                            </div>
                        </div>

                        <div className="section-card" style={{marginBottom:32}}>
                            <h3 style={{fontSize:'1.1rem',fontWeight:700,marginBottom:20}}>Cargo Movement 2021-2025 (Top 5)</h3>
                            <ResponsiveContainer width="100%" height={380}>
                                <LineChart data={lineData}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                    <XAxis dataKey="year" />
                                    <YAxis tickFormatter={v => fmt(v)} />
                                    <Tooltip formatter={v => fmtTonnes(v)} />
                                    <Legend />
                                    {top5.map(p => (
                                        <Line key={p.id} type="monotone" dataKey={p.name} stroke={p.color} strokeWidth={2} dot={{r:3}} isAnimationActive={false} />
                                    ))}
                                </LineChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="section-card">
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:12}}>
                                <h3 style={{fontSize:'1.1rem',fontWeight:700}}>2025 Ranking</h3>
                                <div style={{display:'flex',gap:8}}>
                                    {[['all','All'],['public','Public Ports'],['terminal','Terminals']].map(([key,label]) => (
                                        <button key={key} className={`filter-btn ${filter===key?'active':''}`} onClick={() => setFilter(key)}>{label}</button>
                                    ))}
                                </div>
                            </div>
                            <ResponsiveContainer width="100%" height={Math.max(400, barData.length * 28)}>
                                <BarChart data={barData} layout="vertical" margin={{left:10}}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                    <XAxis type="number" tickFormatter={v => fmt(v)} />
                                    <YAxis dataKey="name" type="category" width={180} tick={{fontSize:11}} interval={0} />
                                    <Tooltip formatter={v => fmtTonnes(v)} />
                                    <Bar dataKey="cargo" fill="#059669" radius={[0,4,4,0]} isAnimationActive={false}
                                         onClick={(d) => onSelectPort(d.id)} style={{cursor:'pointer'}} />
                                </BarChart>
                            </ResponsiveContainer>
                            <p style={{fontSize:'0.75rem',color:'#9ca3af',marginTop:12}}>Click any bar to view port details</p>
                        </div>
                    </div>
                </section>
            );
        }

        // ========== COMPARISON ==========
        function ComparisonSection() {
            const [sel, setSel] = useState(["santos", "paranagua", ""]);
            const selected = sel.map(id => PORTS.find(p => p.id === id)).filter(Boolean);

            const lineData = selected.length > 0 ? [2021,2022,2023,2024,2025].map((yr, i) => {
                const row = { year: yr };
                selected.forEach(p => { row[p.name] = p.data[i].t; });
                return row;
            }) : [];

            const barData = selected.map(p => ({ name: p.name.length > 18 ? p.name.substring(0,18)+'...' : p.name, cargo: p.data[4].t }));

            function updateSel(idx, val) {
                const next = [...sel];
                next[idx] = val;
                setSel(next);
            }

            return (
                <section id="compare" style={{padding:'80px 20px',background:'#f9fafb'}}>
                    <div style={{maxWidth:1200,margin:'0 auto'}}>
                        <h2 style={{fontSize:'2rem',fontWeight:800,marginBottom:40}}>Port Comparison Tool</h2>

                        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:40}}>
                            {[0,1,2].map(idx => (
                                <div key={idx} className="section-card">
                                    <label style={{display:'block',fontSize:'0.8rem',fontWeight:600,color:'#6b7280',marginBottom:8}}>Port {idx+1}</label>
                                    <select value={sel[idx]} onChange={e => updateSel(idx, e.target.value)}
                                        style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid #e5e7eb',fontSize:'0.875rem',fontWeight:500,fontFamily:'Inter',background:'#fff'}}>
                                        <option value="">Select a port...</option>
                                        {PORTS.map(p => <option key={p.id} value={p.id}>{p.rank}. {p.name}</option>)}
                                    </select>
                                </div>
                            ))}
                        </div>

                        {selected.length >= 2 && (
                            <div>
                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,marginBottom:32}}>
                                    <div className="section-card">
                                        <h3 style={{fontSize:'1rem',fontWeight:700,marginBottom:16}}>Cargo Trend Comparison</h3>
                                        <ResponsiveContainer width="100%" height={300}>
                                            <LineChart data={lineData}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                                <XAxis dataKey="year" />
                                                <YAxis tickFormatter={v => fmt(v)} />
                                                <Tooltip formatter={v => fmtTonnes(v)} />
                                                <Legend />
                                                {selected.map(p => (
                                                    <Line key={p.id} type="monotone" dataKey={p.name} stroke={p.color} strokeWidth={2} dot={{r:4}} isAnimationActive={false} />
                                                ))}
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="section-card">
                                        <h3 style={{fontSize:'1rem',fontWeight:700,marginBottom:16}}>2025 Volume Comparison</h3>
                                        <ResponsiveContainer width="100%" height={300}>
                                            <BarChart data={barData}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                                <XAxis dataKey="name" tick={{fontSize:10}} />
                                                <YAxis tickFormatter={v => fmt(v)} />
                                                <Tooltip formatter={v => fmtTonnes(v)} />
                                                <Bar dataKey="cargo" fill="#059669" radius={[4,4,0,0]} isAnimationActive={false} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div style={{display:'grid',gridTemplateColumns:'repeat('+selected.length+',1fr)',gap:16}}>
                                    {selected.map(port => {
                                        const g = pctChange(port.data[3].t, port.data[4].t);
                                        return (
                                            <div key={port.id} className="section-card">
                                                <h4 style={{fontWeight:700,marginBottom:12,fontSize:'0.95rem'}}>{port.name}</h4>
                                                <div style={{display:'grid',gap:8,fontSize:'0.85rem'}}>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>2025 Cargo:</span><span style={{fontWeight:600}}>{fmtTonnes(port.data[4].t)}</span></div>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>2025 Berthings:</span><span style={{fontWeight:600}}>{fmtFull(port.data[4].b)}</span></div>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>YoY Growth:</span><span style={{fontWeight:600,color:g>=0?'#059669':'#dc2626'}}>{g>=0?'+':''}{g}%</span></div>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>Top Cargo:</span><span style={{fontWeight:600}}>{port.cargoes[0][0]}</span></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {selected.length < 2 && (
                            <div className="section-card" style={{textAlign:'center',padding:48,color:'#9ca3af'}}>
                                <p>Select at least 2 ports above to compare.</p>
                            </div>
                        )}
                    </div>
                </section>
            );
        }

        // ========== PORT DETAILS MODAL ==========
        function PortModal({ port, onClose }) {
            if (!port) return null;
            const c25 = port.data[4].t, c24 = port.data[3].t;
            const yoy = pctChange(c24, c25);
            const cumG = pctChange(port.data[0].t, c25);
            const isPublic = port.type === 'Porto Organizado';

            return (
                <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="modal-content">
                        <div style={{background:'linear-gradient(135deg, #064e3b, #059669)',color:'#fff',padding:'32px',borderRadius:'16px 16px 0 0',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                            <div>
                                <h2 style={{fontSize:'1.5rem',fontWeight:800,marginBottom:4}}>{port.name}</h2>
                                <p style={{opacity:0.7,fontSize:'0.9rem'}}>{port.city}, {port.state}</p>
                                <span className={`badge ${isPublic?'badge-public':'badge-terminal'}`} style={{marginTop:8}}>{isPublic ? 'Public Port' : 'Authorised Terminal'}</span>
                            </div>
                            <button onClick={onClose} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',borderRadius:8,width:36,height:36,cursor:'pointer',fontSize:'1.2rem',display:'flex',alignItems:'center',justifyContent:'center'}}>X</button>
                        </div>

                        <div style={{padding:32}}>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:32}}>
                                <div className="kpi-card"><p className="kpi-label">2025 Cargo</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtTonnes(c25)}</p></div>
                                <div className="kpi-card"><p className="kpi-label">2024 Cargo</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtTonnes(c24)}</p></div>
                                <div className="kpi-card"><p className="kpi-label">Berthings 2025</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtFull(port.data[4].b)}</p></div>
                                <div className="kpi-card"><p className="kpi-label">YoY Growth</p><p className="kpi-value" style={{fontSize:'1.3rem',color:yoy>=0?'#059669':'#dc2626'}}>{yoy>=0?'+':''}{yoy}%</p></div>
                            </div>

                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,marginBottom:32}}>
                                <div>
                                    <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Top 5 Cargoes</h3>
                                    {port.cargoes.map(([name, pct], i) => (
                                        <div key={i} style={{marginBottom:12}}>
                                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                                                <span style={{fontSize:'0.8rem',fontWeight:500,color:'#374151'}}>{name}</span>
                                                <span style={{fontSize:'0.8rem',fontWeight:700,color:'#059669'}}>{pct}%</span>
                                            </div>
                                            <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}></div></div>
                                        </div>
                                    ))}
                                </div>
                                <div>
                                    <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Port Information</h3>
                                    <div style={{display:'grid',gap:10,fontSize:'0.85rem'}}>
                                        {[
                                            ['Rank', port.rank + ' / 20'],
                                            ['Type', port.type],
                                            ['Region', port.region],
                                            ['State', port.sc],
                                            ['5-Year Growth', (cumG>=0?'+':'') + cumG + '%'],
                                        ].map(([k,v], i) => (
                                            <div key={i} style={{display:'flex',justifyContent:'space-between',borderBottom:'1px solid #f3f4f6',paddingBottom:8}}>
                                                <span style={{color:'#6b7280'}}>{k}</span><span style={{fontWeight:600}}>{v}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div style={{marginBottom:24}}>
                                <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Annual Cargo Movement</h3>
                                <ResponsiveContainer width="100%" height={250}>
                                    <LineChart data={port.data}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                        <XAxis dataKey="y" />
                                        <YAxis tickFormatter={v => fmt(v)} />
                                        <Tooltip formatter={v => fmtTonnes(v)} />
                                        <Line type="monotone" dataKey="t" stroke={port.color} strokeWidth={2.5} dot={{r:5,fill:port.color}} isAnimationActive={false} name="Cargo" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>

                            <div>
                                <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Annual Berthings</h3>
                                <ResponsiveContainer width="100%" height={200}>
                                    <BarChart data={port.data}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                        <XAxis dataKey="y" />
                                        <YAxis />
                                        <Tooltip />
                                        <Bar dataKey="b" fill={port.color} radius={[4,4,0,0]} isAnimationActive={false} name="Berthings" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== ABOUT ==========
        function AboutSection() {
            return (
                <section id="about" style={{padding:'80px 20px',background:'#fff'}}>
                    <div style={{maxWidth:1000,margin:'0 auto'}}>
                          <h2 style={{fontSize:'2rem',fontWeight:800,marginBottom:40}}>About</h2>

                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,marginBottom:48}}>
                            <div className="section-card">
                                <h3 style={{fontWeight:700,fontSize:'1.1rem',marginBottom:12}}>Project Overview</h3>
                                <p style={{color:'#4b5563', lineHeight:1.7,fontSize:'0.9rem'}}>
                                    This analytics dashboard provides comprehensive insights into Brazil's 20 largest ports and terminals, tracking cargo movement and operational metrics from 2021 through 2025. It covers public ports and authorised terminals across 12 Brazilian states, enabling port operators, researchers, and policymakers to analyse trends and compare facilities.
                                </p>
                            </div>
                            <div className="section-card" style={{borderLeft:'4px solid #059669'}}>
                                <h3 style={{fontWeight:700,fontSize:'1.1rem',marginBottom:12}}>About the Researcher</h3>
                                <p style={{fontWeight:600,color:'#111827',marginBottom:8}}>Darliane Ribeiro Cunha, PhD</p>
                                <p style={{color:'#4b5563',lineHeight:1.7,fontSize:'0.9rem',marginBottom:12}}>
                                    Associate Professor at UFMA (Federal University of Maranhao). Researcher in maritime sustainability, port governance, and environmental analytics with 20+ years of experience.
                                </p>
                                <a href="mailto:darlianerc@gmail.com" style={{color:'#059669',fontWeight:600,fontSize:'0.85rem',textDecoration:'none'}}>darlianerc@gmail.com</a>
                            </div>
                        </div>

                        <div className="section-card" style={{background:'#f9fafb',marginBottom:32}}>
                            <h3 style={{fontWeight:700,marginBottom:8,fontSize:'0.95rem'}}>Data Source</h3>
                            <p style={{color:'#4b5563',fontSize:'0.85rem'}}><strong>ANTAQ</strong> (Agencia Nacional de Transportes Aquaviarios) - National Waterway Transportation Agency. Official Brazilian agency for waterway regulation.</p>
                        </div>
                    </div>
                </section>
            );
        }

        // ========== APP ==========
        function App() {
            const [selectedPort, setSelectedPort] = useState(null);
            const handleNavigate = (id) => {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div>
                    <HeroSection onNavigate={handleNavigate} />
                    <NavBar onNavigate={handleNavigate} />
                    <OverviewSection onSelectPort={setSelectedPort} />
                    <ComparisonSection />
                    <AboutSection />
                    <footer style={{background:'#0f172a',color:'#fff',padding:'32px 20px',textAlign:'center'}}>
                        <p style={{color:'#6b7280',fontSize:'0.8rem'}}>2025 Brazil's Top 20 Ports & Terminals Dashboard. Data: ANTAQ. Developed by Darliane Ribeiro Cunha, PhD.</p>
                    </footer>
                    {selectedPort && <PortModal port={PORTS.find(p => p.id === selectedPort)} onClose={() => setSelectedPort(null)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
